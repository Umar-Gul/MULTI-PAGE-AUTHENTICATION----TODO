<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 id="welcomeMsg">Welcome</h3>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <form id="todoForm" class="d-flex mb-3">
      <input type="text" id="todoInput" class="form-control me-2" placeholder="Add a new task..." required>
      <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <ul id="todoList" class="list-group"></ul>
    <button onclick="clearTodos()" class="btn btn-outline-danger mt-3">Delete All Todos</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
